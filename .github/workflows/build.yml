name: Build Theos Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          brew install ldid xz

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
      - name: Download iOS SDK
        run: |
          git clone https://github.com/theos/sdks.git /tmp/sdks
          mv /tmp/sdks/* $THEOS/sdks/

      - name: Build Tweak (.dylib)
        run: |
          make
          
      - name: Upload .dylib
        uses: actions/upload-artifact@v4
        with:
          name: tweak-dylib
          path: .theos/obj/**/*.dylib

  build-insert-dylib:
    runs-on: windows-latest
    steps:
      - name: Checkout hookforge/insert-dylib
        uses: actions/checkout@v4
        with:
          repository: hookforge/insert-dylib

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build insert-dylib.exe
        run: cargo build --release

      - name: Upload insert-dylib.exe
        uses: actions/upload-artifact@v4
        with:
          name: insert-dylib-windows
          path: target/release/insert-dylib.exe
